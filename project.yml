name: Clam
options:
  bundleIdPrefix: app.getclam
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set your team in Xcode or here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only for v1
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  Clam:
    type: application
    platform: iOS
    sources:
      - path: Clam
      - path: Shared
    dependencies:
      - target: ClamShield
      - target: ClamWidgets
      - target: ClamMonitor
      - package: PostHog
    entitlements:
      path: Clam/Clam.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.getclam.clam
    info:
      path: Clam/Info.plist
      properties:
        CFBundleDisplayName: Clam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSMotionUsageDescription: Clam uses motion to notice when your phone is resting face-down during a session.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getclam.clam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [ClamTests]
      storeKitConfiguration: Clam/Resources/Products.storekit

  ClamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClamTests
    dependencies:
      - target: Clam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getclam.clam.tests
        GENERATE_INFOPLIST_FILE: true

  ClamShield:
    type: app-extension
    platform: iOS
    sources:
      - path: ClamShield
      - path: Shared
    entitlements:
      path: ClamShield/ClamShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.getclam.clam
    info:
      path: ClamShield/Info.plist
      properties:
        CFBundleDisplayName: Clam Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getclam.clam.shield

  ClamMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ClamMonitor
      - path: Shared
    entitlements:
      path: ClamMonitor/ClamMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.getclam.clam
    info:
      path: ClamMonitor/Info.plist
      properties:
        CFBundleDisplayName: Clam Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ClamMonitorExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getclam.clam.monitor

  ClamWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ClamWidgets
      - path: Shared
      - path: Clam/Intents/StartClamSessionIntent.swift
    entitlements:
      path: ClamWidgets/ClamWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.getclam.clam
    info:
      path: ClamWidgets/Info.plist
      properties:
        CFBundleDisplayName: Clam Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getclam.clam.widgets
