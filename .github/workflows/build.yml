name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS Simulator build + unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "^\s+iPhone" | head -1 | sed -E 's/^ *(.+) \([0-9A-F-]+\) \(.*/\1/')
          echo "Using simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Clam.xcodeproj \
            -scheme Clam \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*Clam|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" build.log

      # Apple rejects uploads that use a required-reason API without declaring it
      # (ITMS-91053). We use UserDefaults everywhere, so every bundle needs its manifest
      # to actually reach the product, not just sit in the repo.
      - name: Privacy manifests are bundled
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Clam.app" -path "*Debug-iphonesimulator*" | head -1)
          [ -n "$APP" ] || { echo "no built Clam.app found"; exit 1; }
          fail=0
          check() { if [ -f "$1" ]; then echo "ok   $1"; else echo "MISSING $1"; fail=1; fi; }
          check "$APP/PrivacyInfo.xcprivacy"
          for ext in ClamShield ClamMonitor ClamWidgets; do
            check "$APP/PlugIns/$ext.appex/PrivacyInfo.xcprivacy"
          done
          exit $fail

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Clam.xcodeproj \
            -scheme Clam \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:ClamTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
