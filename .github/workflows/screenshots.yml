name: Screenshots

# Boots a simulator, launches the app on every screen with seeded data, and commits the PNGs
# to docs/screenshots/. Run it from the Actions tab (workflow_dispatch) whenever the UI changes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator (largest iPhone, for 6.9-inch App Store shots)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "^\s+iPhone .*Pro Max" | head -1 | sed -E 's/^ *(.+) \([0-9A-F-]+\) \(.*/\1/')
          [ -n "$DEVICE" ] || DEVICE=$(xcrun simctl list devices available | grep -E "^\s+iPhone" | head -1 | sed -E 's/^ *(.+) \([0-9A-F-]+\) \(.*/\1/')
          echo "Using simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Clam.xcodeproj -scheme Clam \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Boot simulator and install
        run: |
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          APP=$(find DerivedData/Build/Products -name "Clam.app" -maxdepth 2 | head -1)
          echo "App: $APP"
          xcrun simctl install "$DEVICE" "$APP"

      - name: Capture every screen
        run: |
          python3 -m venv .venv && .venv/bin/pip install --quiet pillow
          mkdir -p docs/screenshots crashlogs
          brightness() { .venv/bin/python -c "from PIL import Image, ImageStat; import sys; print(int(ImageStat.Stat(Image.open(sys.argv[1]).convert('L')).mean[0]))" "$1"; }
          for s in hook hours apps triggers reveal permission taste result paywall home session settings share; do
            for attempt in 1 2 3; do
              xcrun simctl terminate "$DEVICE" app.getclam.clam >/dev/null 2>&1 || true
              sleep 1
              xcrun simctl launch "$DEVICE" app.getclam.clam -screenshot "$s" >/dev/null
              sleep 8
              xcrun simctl io "$DEVICE" screenshot "docs/screenshots/$s.png" >/dev/null
              mean=$(brightness "docs/screenshots/$s.png")
              if [ "$mean" -ge 6 ]; then echo "captured $s (attempt $attempt, brightness $mean)"; break; fi
              echo "  $s: blank frame on attempt $attempt (brightness $mean); app log follows"
              xcrun simctl spawn "$DEVICE" log show --last 20s --predicate 'process == "Clam"' --style compact 2>/dev/null | tail -30 | tee -a "crashlogs/$s-attempt$attempt.log" || true
            done
          done
          find ~/Library/Logs/DiagnosticReports -name "Clam*" -newer build.log -exec cp {} crashlogs/ \; 2>/dev/null || true
          ls crashlogs || true
          # Downscaled copies for quick review (skip existing thumbnails).
          cd docs/screenshots && rm -f small-*.png && for f in *.png; do sips -Z 600 "$f" --out "small-$f" >/dev/null; done

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Screenshots from simulator ($DEVICE) [skip ci]" || { echo "no changes"; exit 0; }
          # The branch may have moved while the simulator ran; rebase our one commit on top and retry.
          for attempt in 1 2 3 4; do
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            git rebase --abort || true
            sleep 10
          done
          echo "could not push after 4 attempts"; exit 1

      - name: Upload artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/screenshots
            crashlogs
          if-no-files-found: ignore

  small:
    name: Smallest iPhone (layout guard for 375pt-wide screens)
    runs-on: macos-26
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pick the smallest available iPhone
        id: dev
        run: |
          # Smallest first. The runner image has no SE, so the realistic floor is a 6.1-inch
          # 390x844 phone; a true 375x667 SE has to be run locally (see playbook 04).
          AVAIL=$(xcrun simctl list devices available)
          for n in "iPhone SE (3rd generation)" "iPhone SE" "iPhone 16e" "iPhone 17e" "iPhone 17"; do
            if echo "$AVAIL" | grep -qE "^ *$(echo "$n" | sed 's/[()]/\\&/g') \("; then
              echo "name=$n" >> "$GITHUB_OUTPUT"; echo "using $n"; exit 0
            fi
          done
          echo "no suitable iPhone on this image"; echo "$AVAIL"; exit 1

      - name: Build and capture
        run: |
          brew install xcodegen
          scripts/capture-screens.sh --device "${{ steps.dev.outputs.name }}" --no-tests --out docs/screenshots/small

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/small
          git commit -m "Smallest-iPhone screenshots [skip ci]" || { echo "no changes"; exit 0; }
          for attempt in 1 2 3 4; do
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            git rebase --abort || true; sleep 10
          done
          exit 1

  duo:
    name: iPhone Duo simulator (needs Xcode 27.1 on the runner image)
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Find Xcode 27
        id: xc
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          echo "Available Xcodes:"; ls -d /Applications/Xcode*.app
          if [ -z "$XC" ]; then echo "No Xcode 27 on this image yet; skipping."; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "found=true" >> "$GITHUB_OUTPUT"; echo "xcode=$XC" >> "$GITHUB_OUTPUT"

      - name: Build, capture (scripts/capture-screens.sh)
        if: steps.xc.outputs.found == 'true'
        run: |
          brew install xcodegen
          DEVELOPER_DIR="${{ steps.xc.outputs.xcode }}/Contents/Developer" scripts/capture-screens.sh --ci

      - name: Commit Duo screenshots
        if: steps.xc.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/duo
          git commit -m "iPhone Duo simulator screenshots [skip ci]" || { echo "no changes"; exit 0; }
          for attempt in 1 2 3 4; do
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            git rebase --abort || true; sleep 10
          done
          exit 1
